<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lynn English Radio v8</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f6f8}
*{box-sizing:border-box}body{margin:0}.app{max-width:780px;margin:auto;padding:24px 16px 80px}
h1{font-size:30px;margin:4px 0}.sub,.status,.note{color:#697386}.badge{display:inline-block;background:#e9edf5;padding:6px 9px;border-radius:999px;font-size:12px;margin:12px 0}
.tabs,.controls,.tracklist,.row{display:flex;gap:8px;flex-wrap:wrap}.tracklist{overflow:auto;flex-wrap:nowrap;padding-bottom:10px}
button,select{border:1px solid #d5d9e0;background:white;border-radius:12px;padding:10px 13px;font-size:15px}
.tabs button.active,.trackbtn.active{background:#172033;color:white}.trackbtn{min-width:max-content}
.card{background:white;border-radius:18px;padding:18px;margin-top:14px}.sentence{border-top:1px solid #eceef2;padding:14px 0}.sentence:first-of-type{border-top:0}
.en{font-size:18px;line-height:1.45}.zh{color:#6c7584;margin-top:5px}.status{margin:12px 0}.note{font-size:12px;margin-top:12px}
@media(max-width:480px){h1{font-size:27px}.controls button,.controls select{flex:1}.en{font-size:17px}}
</style>
</head>
<body>
<main class="app">
<h1>Lynn English Radio</h1>
<div class="sub">English that grows out of real life.</div>
<div class="badge">AI Normal · Screen-off test · v8</div>

<div class="tabs"><button id="work">Work</button><button id="life">Life</button></div>
<div class="tracklist" id="tracklist"></div>

<div class="controls">
<button id="play">▶ Play All</button>
<button id="loop">↻ Loop All</button>
<button id="stop">■ Stop</button>
<select id="rate"><option>.85</option><option>.95</option><option selected>1.0</option><option>1.1</option></select>
<button id="zhbtn">中文 On</button>
</div>

<div class="status" id="status">Ready</div>
<section class="card" id="card"></section>
<div class="note">Play All / Loop All use stored AI Normal MP3 files. This page is specifically for testing iPhone lock-screen/background playback.</div>
<audio id="player" preload="metadata"></audio>
</main>

<script src="tracks.js?v=8"></script>
<script src="accounting.js?v=8"></script>
<script src="track-audio.js?v=8"></script>
<script>
const T=window.LYNN_TRACKS||[], A=window.LYNN_TRACK_AUDIO||{};
let channel=localStorage.v8channel||'work', ti=0, showZh=localStorage.v8zh!=='off';
const player=document.getElementById('player'), rate=document.getElementById('rate'), status=document.getElementById('status');
rate.value=localStorage.v8rate||'1.0'; player.playbackRate=+rate.value;

function pool(){return T.filter(t=>t.channel===channel&&t.status!=='archive')}
function cur(){return pool()[ti]}
function render(){
  document.getElementById('work').classList.toggle('active',channel==='work');
  document.getElementById('life').classList.toggle('active',channel==='life');
  const p=pool(); if(ti>=p.length)ti=0;
  tracklist.innerHTML=p.map((t,i)=>'<button class="trackbtn '+(i===ti?'active':'')+'" onclick="choose('+i+')">'+t.title+'</button>').join('');
  const t=cur(); if(!t){card.innerHTML='No tracks';return}
  card.innerHTML='<h2>'+t.title+'</h2><div class="sub">'+t.meta+'</div>'+t.sentences.map((s,i)=>'<div class="sentence"><div class="en">'+s.en+'</div><div class="zh" style="display:'+(showZh?'block':'none')+'">'+s.zh+'</div></div>').join('');
  zhbtn.textContent='中文 '+(showZh?'On':'Off');
}
function choose(i){stop();ti=i;render()}
function setChannel(c){stop();channel=c;localStorage.v8channel=c;ti=0;render()}
work.onclick=()=>setChannel('work'); life.onclick=()=>setChannel('life');
zhbtn.onclick=()=>{showZh=!showZh;localStorage.v8zh=showZh?'on':'off';render()};
rate.onchange=()=>{localStorage.v8rate=rate.value;player.playbackRate=+rate.value};

function mediaSession(t){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:'Lynn English Radio',album:'AI Normal'});
    navigator.mediaSession.setActionHandler('play',()=>player.play());
    navigator.mediaSession.setActionHandler('pause',()=>player.pause());
    navigator.mediaSession.setActionHandler('seekbackward',d=>player.currentTime=Math.max(0,player.currentTime-(d.seekOffset||15)));
    navigator.mediaSession.setActionHandler('seekforward',d=>player.currentTime=Math.min(player.duration||Infinity,player.currentTime+(d.seekOffset||15)));
    navigator.mediaSession.setActionHandler('stop',()=>stop());
  }catch(e){}
}
function start(looping){
  const t=cur(), src=t&&A[t.title];
  if(!src){status.textContent='AI audio is not ready for this track.';return}
  player.pause(); player.src=src+'?v=8'; player.loop=!!looping; player.playbackRate=+rate.value;
  mediaSession(t); status.textContent=(looping?'Looping · ':'Playing · ')+t.title+' · AI Normal';
  player.play().catch(()=>status.textContent='Tap Play All once more to start.');
}
function stop(){player.pause();player.loop=false;try{player.currentTime=0}catch(e){}status.textContent='Stopped'}
play.onclick=()=>start(false); loop.onclick=()=>start(true); document.getElementById('stop').onclick=stop;
player.onended=()=>{if(!player.loop)status.textContent='Ready'};
player.onplay=()=>{try{if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'}catch(e){}};
player.onpause=()=>{try{if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'}catch(e){}};
render();
</script>
</body>
</html>
