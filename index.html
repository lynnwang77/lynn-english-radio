<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lynn English Radio</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:780px;margin:auto;padding:24px 16px 80px}h1{font-size:30px;margin:5px 0}.sub{color:#697386;margin-bottom:18px}.tabs,.controls{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.controls button,.controls select{border:1px solid #d5d9e0;background:white;border-radius:12px;padding:10px 13px;font-size:15px}.tabs button.active{background:#172033;color:white}.badge{display:inline-block;background:#e9edf5;padding:6px 9px;border-radius:999px;font-size:12px;margin:5px 0 16px}.tracklist{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.trackbtn{min-width:max-content;border:1px solid #d5d9e0;background:white;border-radius:12px;padding:9px 12px}.trackbtn.active{border-color:#172033;font-weight:700}.card{background:white;border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 3px 16px #0000000b}.meta{color:#7a8495;font-size:13px}.sentence{border-top:1px solid #eceef2;padding:15px 0}.sentence:first-of-type{border-top:0}.en{font-size:18px;line-height:1.45}.zh{color:#6c7584;margin:6px 0}.row{display:flex;gap:7px;margin-top:9px}.row button{border:0;background:#eef1f5;border-radius:10px;padding:8px 10px}.playing{outline:2px solid #172033;border-radius:10px;padding:8px}.status{font-size:13px;color:#6c7584;margin-top:10px}@media(max-width:480px){h1{font-size:26px}.controls button,.controls select{flex:1}.en{font-size:17px}}
</style></head><body><main class="app"><h1>Lynn English Radio</h1><div class="sub">English that grows out of real life.</div><div class="badge">Natural voice · Normal · v4</div><div class="tabs"><button id="work">Work</button><button id="life">Life</button></div><div class="tracklist" id="tracklist"></div><div class="controls"><button onclick="playAll(false)">▶ Play All</button><button onclick="playAll(true)">↻ Loop All</button><button onclick="stopAll()">■ Stop</button><select id="rate"><option>.85</option><option>.95</option><option selected>1.0</option><option>1.1</option></select><button id="zhbtn">中文 On</button></div><div class="status" id="status">Ready</div><section class="card" id="card"></section></main><script src="tracks.js"></script><script>
const T=window.LYNN_TRACKS; let channel=localStorage.channel||'work', ti=0, mode='stop', si=0, showZh=localStorage.zh!=='off'; const player=new Audio();
function filtered(){return T.filter(x=>x.channel===channel)} function cur(){return filtered()[ti]}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id===channel));let f=filtered();if(ti>=f.length)ti=0;tracklist.innerHTML=f.map((t,i)=>`<button class="trackbtn ${i===ti?'active':''}" onclick="choose(${i})">${t.title}${t.title==='Bank Account Opening'?' · NEW':''}</button>`).join('');let t=cur();card.innerHTML=`<h2>${t.title}</h2><div class="meta">${t.meta} · ${t.sentences.length} sentences</div>`+t.sentences.map((s,i)=>`<div class="sentence" id="s${i}"><div class="en">${s.en}</div><div class="zh" style="display:${showZh?'block':'none'}">${s.zh}</div><div class="row"><button onclick="playOne(${i})">▶ Sentence</button><button onclick="loopOne(${i})">↻ Loop Sentence</button></div></div>`).join('');zhbtn.textContent='中文 '+(showZh?'On':'Off');localStorage.channel=channel}
function choose(i){stopAll();ti=i;render()} work.onclick=()=>{stopAll();channel='work';ti=0;render()};life.onclick=()=>{stopAll();channel='life';ti=0;render()};zhbtn.onclick=()=>{showZh=!showZh;localStorage.zh=showZh?'on':'off';render()};rate.onchange=()=>{player.playbackRate=+rate.value;localStorage.rate=rate.value};rate.value=localStorage.rate||'1.0';
function mark(i){document.querySelectorAll('.sentence').forEach(x=>x.classList.remove('playing'));let e=document.getElementById('s'+i);if(e)e.classList.add('playing')}
function start(i){si=i;let s=cur().sentences[i];player.src=s.audio;player.playbackRate=+rate.value;mark(i);status.textContent=s.en;player.play().catch(()=>status.textContent='Tap play again to start audio.')}
function playOne(i){mode='one';player.onended=()=>{mode='stop';status.textContent='Ready'};start(i)}
function loopOne(i){mode='sentence';player.onended=()=>{if(mode==='sentence')setTimeout(()=>start(i),450)};start(i)}
function playAll(loop){mode=loop?'allloop':'all';si=0;player.onended=()=>{if(!mode.startsWith('all'))return;if(si+1<cur().sentences.length){setTimeout(()=>start(++si),250)}else if(mode==='allloop'){setTimeout(()=>start(si=0),650)}else{mode='stop';status.textContent='Ready'}};start(0)}
function stopAll(){mode='stop';player.pause();player.currentTime=0;player.onended=null;status.textContent='Stopped';document.querySelectorAll('.sentence').forEach(x=>x.classList.remove('playing'))} render();
</script></body></html>
