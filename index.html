<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lynn English Radio</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:780px;margin:auto;padding:24px 16px 80px}h1{font-size:30px;margin:5px 0}.sub{color:#697386;margin-bottom:14px}.tabs,.views,.controls{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:10px}.views{margin-bottom:12px}.tabs button,.views button,.controls button,.controls select{border:1px solid #d5d9e0;background:white;border-radius:12px;padding:10px 13px;font-size:15px}.tabs button.active{background:#172033;color:white}.views button.active{background:#e8edf5;border-color:#9ba7ba;font-weight:700}.badge{display:inline-block;background:#e9edf5;padding:6px 9px;border-radius:999px;font-size:12px;margin:5px 0 16px}.tracklist{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.trackbtn{min-width:max-content;border:1px solid #d5d9e0;background:white;border-radius:12px;padding:9px 12px}.trackbtn.active{border-color:#172033;font-weight:700}.card{background:white;border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 3px 16px #0000000b}.meta{color:#7a8495;font-size:13px}.sentence{border-top:1px solid #eceef2;padding:15px 0}.sentence:first-of-type{border-top:0}.en{font-size:18px;line-height:1.45}.zh{color:#6c7584;margin:6px 0}.source{font-size:12px;color:#8791a2;margin-top:4px}.row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.row button{border:0;background:#eef1f5;border-radius:10px;padding:8px 10px}.row button.starred{background:#fff1c7}.playing{outline:2px solid #172033;border-radius:10px;padding:8px}.status{font-size:13px;color:#6c7584;margin-top:10px}.empty{color:#7a8495;padding:20px 0}.note{font-size:12px;color:#8a94a5;margin-top:10px}@media(max-width:480px){h1{font-size:26px}.controls button,.controls select{flex:1}.en{font-size:17px}}
</style></head><body><main class="app"><h1>Lynn English Radio</h1><div class="sub">English that grows out of real life.</div><div class="badge">Natural voice · Normal · v6</div><div class="tabs"><button id="work">Work</button><button id="life">Life</button></div><div class="views"><button id="currentView">Current</button><button id="favoritesView">★ Favorites</button><button id="archiveView">Archive</button></div><div class="tracklist" id="tracklist"></div><div class="controls"><button onclick="playAll(false)">▶ Play All</button><button onclick="playAll(true)">↻ Loop All</button><button onclick="stopAll()">■ Stop</button><select id="rate"><option>.85</option><option>.95</option><option selected>1.0</option><option>1.1</option></select><button id="zhbtn">中文 On</button></div><div class="status" id="status">Ready</div><section class="card" id="card"></section><div class="note">Favorites are saved on this device.</div></main><script src="tracks.js"></script><script src="accounting.js"></script><script>
const T=window.LYNN_TRACKS;let channel=localStorage.channel||'work',view=localStorage.view||'current',ti=0,mode='stop',si=0,showZh=localStorage.zh!=='off';const player=new Audio();let favorites=new Set(JSON.parse(localStorage.favorites||'[]'));
function key(t,s){return [t.channel,t.title,s.en].join('||')}
function pools(){return T.filter(t=>t.channel===channel&&((view==='archive')?t.status==='archive':t.status!=='archive'))}
function favItems(){let a=[];T.filter(t=>t.channel===channel).forEach(t=>t.sentences.forEach(s=>{if(favorites.has(key(t,s)))a.push({t,s})}));return a}
function curTrack(){return pools()[ti]}
function items(){if(view==='favorites')return favItems().map(x=>({audio:x.s.audio,en:x.s.en,zh:x.s.zh,t:x.t,s:x.s}));let t=curTrack();return t?t.sentences.map(s=>({audio:s.audio,en:s.en,zh:s.zh,t,s})):[]}
function setActive(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id===channel));currentView.classList.toggle('active',view==='current');favoritesView.classList.toggle('active',view==='favorites');archiveView.classList.toggle('active',view==='archive')}
function sentenceHTML(it,i,showSource=false){let k=key(it.t,it.s),fav=favorites.has(k);return `<div class="sentence" id="s${i}"><div class="en">${it.en}</div><div class="zh" style="display:${showZh?'block':'none'}">${it.zh}</div>${showSource?`<div class="source">${it.t.title} · ${it.t.meta}</div>`:''}<div class="row"><button onclick="playOne(${i})">▶ Sentence</button><button onclick="loopOne(${i})">↻ Loop Sentence</button><button class="${fav?'starred':''}" onclick="toggleFavorite(${i})">${fav?'★ Saved':'☆ Favorite'}</button></div></div>`}
function render(){setActive();localStorage.channel=channel;localStorage.view=view;let list=pools();if(view==='favorites'){tracklist.innerHTML='';let its=items();card.innerHTML=`<h2>Favorites</h2><div class="meta">${its.length} saved sentences · ${channel==='work'?'Work':'Life'}</div>`+(its.length?its.map((it,i)=>sentenceHTML(it,i,true)).join(''):'<div class="empty">Tap ☆ Favorite on any sentence to build your personal rotation.</div>');zhbtn.textContent='中文 '+(showZh?'On':'Off');return}
if(ti>=list.length)ti=0;tracklist.innerHTML=list.map((t,i)=>`<button class="trackbtn ${i===ti?'active':''}" onclick="choose(${i})">${t.title}${t.meta==='Accounting Statements · Current'&&view==='current'?' · NEW':(t.title==='Bank Account Opening'&&view==='current'?' · NEW':'')}</button>`).join('');if(!list.length){card.innerHTML=`<h2>${view==='archive'?'Archive':'Current'}</h2><div class="empty">${view==='archive'?'Nothing archived yet. When a rotation is retired, it will stay here.':'No tracks here yet.'}</div>`;zhbtn.textContent='中文 '+(showZh?'On':'Off');return}let t=curTrack(),its=items();card.innerHTML=`<h2>${t.title}</h2><div class="meta">${t.meta} · ${its.length} sentences · ${view==='archive'?'Archive':'Current'}</div>`+its.map((it,i)=>sentenceHTML(it,i,false)).join('');zhbtn.textContent='中文 '+(showZh?'On':'Off')}
function choose(i){stopAll();ti=i;render()}
function setChannel(c){stopAll();channel=c;ti=0;render()}work.onclick=()=>setChannel('work');life.onclick=()=>setChannel('life');
function setView(v){stopAll();view=v;ti=0;render()}currentView.onclick=()=>setView('current');favoritesView.onclick=()=>setView('favorites');archiveView.onclick=()=>setView('archive');
zhbtn.onclick=()=>{showZh=!showZh;localStorage.zh=showZh?'on':'off';render()};rate.onchange=()=>{player.playbackRate=+rate.value;localStorage.rate=rate.value};rate.value=localStorage.rate||'1.0';
function mark(i){document.querySelectorAll('.sentence').forEach(x=>x.classList.remove('playing'));let e=document.getElementById('s'+i);if(e)e.classList.add('playing')}
function start(i){let its=items();if(!its.length)return;si=i;let it=its[i];player.src=it.audio;player.playbackRate=+rate.value;mark(i);status.textContent=it.en;player.play().catch(()=>status.textContent='Tap play again to start audio.')}
function playOne(i){mode='one';player.onended=()=>{mode='stop';status.textContent='Ready'};start(i)}
function loopOne(i){mode='sentence';player.onended=()=>{if(mode==='sentence')setTimeout(()=>start(i),450)};start(i)}
function playAll(loop){let its=items();if(!its.length){status.textContent='Nothing to play';return}mode=loop?'allloop':'all';si=0;player.onended=()=>{let now=items();if(!mode.startsWith('all')||!now.length)return;if(si+1<now.length){setTimeout(()=>start(++si),250)}else if(mode==='allloop'){setTimeout(()=>start(si=0),650)}else{mode='stop';status.textContent='Ready'}};start(0)}
function stopAll(){mode='stop';player.pause();player.currentTime=0;player.onended=null;status.textContent='Stopped';document.querySelectorAll('.sentence').forEach(x=>x.classList.remove('playing'))}
function toggleFavorite(i){let its=items(),it=its[i];if(!it)return;let k=key(it.t,it.s);favorites.has(k)?favorites.delete(k):favorites.add(k);localStorage.favorites=JSON.stringify([...favorites]);stopAll();render()}
render();
</script></body></html>
