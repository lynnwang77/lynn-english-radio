name: Probe AI audio
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-ai-audio.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect AI audio app JS
        run: |
          set -euxo pipefail
          BASE='https://www.aidocmaker.com'
          URL="$BASE/g0/audio?name=b88be6b101f442a799356821d2a5d618"
          curl -L -sS "$URL" -o /tmp/body
          python - <<'PY' >/tmp/scripts.txt
          import re,html
          s=html.unescape(open('/tmp/body',encoding='utf-8').read())
          for x in re.findall(r'<script[^>]+src="([^"]+)"',s):
              print(x)
          PY
          mkdir -p /tmp/chunks
          i=0
          while IFS= read -r src; do
            i=$((i+1))
            curl -L -sS "$BASE$src" -o "/tmp/chunks/$i.js" || true
          done </tmp/scripts.txt
          echo '--- interesting endpoints / audio logic ---'
          grep -RniE -m 80 'searchParams|URLSearchParams|preview_url|context_id|audio_url|audioUrl|downloadUrl|download_url|/api/|\.mp3|storage\.googleapis|name\)' /tmp/chunks | head -200 || true
